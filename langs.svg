<svg width="480" height="120" viewBox="0 0 480 120" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="120" rx="10" fill="#1a1b27"/>

  <!-- Title -->
  <text x="24" y="28" font-family="monospace" font-size="13" font-weight="600" fill="#a9b1d6">Top Languages</text>

  <!-- Bar segments (total width 432, starting x=24) -->
  <!-- Python 68% = 294px -->
  <rect x="24" y="42" width="294" height="12" rx="6" fill="#3572A5"/>
  <!-- Java 16% = 69px -->
  <rect x="318" y="42" width="69" height="12" rx="0" fill="#b07219"/>
  <!-- JavaScript 10% = 43px -->
  <rect x="387" y="42" width="43" height="12" rx="0" fill="#f1e05a"/>
  <!-- C++ 6% = 26px, end rounded -->
  <rect x="430" y="42" width="26" height="12" rx="0" fill="#00599C"/>
  <!-- right cap -->
  <rect x="444" y="42" width="12" height="12" rx="6" fill="#00599C"/>

  <!-- Legend row 1 -->
  <circle cx="24" cy="80" r="5" fill="#3572A5"/>
  <text x="34" y="85" font-family="monospace" font-size="11" fill="#a9b1d6">Python</text>

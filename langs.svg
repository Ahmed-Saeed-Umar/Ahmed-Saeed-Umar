  <circle cx="120" cy="80" r="5" fill="#b07219"/>
  <text x="130" y="85" font-family="monospace" font-size="11" fill="#a9b1d6">Java</text>
  <text x="130" y="98" font-family="monospace" font-size="10" fill="#565f89">16%</text>

  <circle cx="200" cy="80" r="5" fill="#f1e05a"/>
  <text x="210" y="85" font-family="monospace" font-size="11" fill="#a9b1d6">JavaScript</text>
  <text x="210" y="98" font-family="monospace" font-size="10" fill="#565f89">10%</text>

  <circle cx="310" cy="80" r="5" fill="#00599C"/>
  <text x="320" y="85" font-family="monospace" font-size="11" fill="#a9b1d6">C++</text>
  <text x="320" y="98" font-family="monospace" font-size="10" fill="#565f89">6%</text>
